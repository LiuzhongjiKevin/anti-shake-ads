name: Withdraw previously published releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/withdraw-releases.yml']
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the three releases explicitly withdrawn by the owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE repos/"$GH_REPO"/releases/396734414
          gh api --method DELETE repos/"$GH_REPO"/releases/394746983
          gh api --method DELETE repos/"$GH_REPO"/releases/394339141
          test "$(gh api repos/"$GH_REPO"/releases --jq length)" = 0
          echo 'All three releases and their assets have been withdrawn.'
