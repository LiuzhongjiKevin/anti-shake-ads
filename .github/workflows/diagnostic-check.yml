name: Diagnostic observer checks
on:
  push:
    branches: [main, diagnostics/ctrip-observer]
    paths: ['app/**', 'tests/**', 'scripts/test-core.sh', '.github/workflows/diagnostic-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          bash scripts/test-core.sh
          sed -i "s/testInstrumentationRunner 'cn.returnguard.UiSmoke'/testInstrumentationRunner 'cn.returnguard.DiagnosticSmoke'/" app/build.gradle
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p reports/diagnostic
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w cn.returnguard.test/cn.returnguard.DiagnosticSmoke > reports/diagnostic/instrumentation.txt
            cat reports/diagnostic/instrumentation.txt
            grep -q 'DIAGNOSTIC_SMOKE_PASSED' reports/diagnostic/instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-apk-and-checks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            reports/diagnostic/
