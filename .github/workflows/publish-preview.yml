name: Publish tested UI preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-preview.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect test evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35870898834 --pattern 'emulator-api-*' --dir preview
          python3 - <<'PY'
          import pathlib,base64
          for name in ['emulator-api-29/delayed-before.png','emulator-api-35/clicked-before.png','emulator-api-35/failure.png']:
              p=pathlib.Path('preview')/name
              if p.exists():print('IMAGE '+name+' '+base64.b64encode(p.read_bytes()).decode())
          for name in ['emulator-api-35/failure-accessibility.txt','emulator-api-35/logcat.txt']:
              p=pathlib.Path('preview')/name
              if p.exists():
                  print('EVIDENCE '+name)
                  for l in p.read_text().splitlines():
                      if 'accessibility' in name or any(s in l for s in ['cn.returnguard','AccessibilityManager','FATAL EXCEPTION']):print(l)
          PY
