name: Requested Baozi real-app observation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/baozi-observe.yml', 'scripts/baozi-observe.py', 'app/src/androidTest/java/cn/returnguard/BaoziCapture.java']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - name: Download the user-specified APK and identify package
        run: |
          mkdir -p downloads reports/baozi
          curl --fail --location --retry 2 --max-time 180 'https://dl.baozimh.com/apks/baozimhappgb_latest.apk' -o downloads/baozi.apk
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging downloads/baozi.apk > reports/baozi/apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs downloads/baozi.apk > reports/baozi/apk-signature.txt
          sha256sum downloads/baozi.apk > reports/baozi/apk-sha256.txt
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          s=Path('reports/baozi/apk-metadata.txt').read_text()
          pkg=re.search(r"package: name='([^']+)'",s).group(1)
          assert re.fullmatch(r'[a-zA-Z0-9_.]+',pkg)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('BAOZI_PACKAGE='+pkg+'\n')
          print(s[:1800])
          PY
      - name: Build current guard and observation-only instrumentation
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 480x960
            adb shell wm density 200
            python3 scripts/baozi-observe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: baozi-real-app-observation, path: reports/baozi/}
