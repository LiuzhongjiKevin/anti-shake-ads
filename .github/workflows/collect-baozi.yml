name: Collect completed Baozi screenshots
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-baozi.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve the completed observation and split transport parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/"$GH_REPO"/actions/artifacts/10898640281/zip > capture.zip
          python3 - <<'PY'
          import zipfile,re,hashlib
          from pathlib import Path
          data=Path('capture.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='ca6d430dfb9adade81b9e81be0601d4da71cbf0c32f7fc9dc7a7b5a4a94c3c33'
          with zipfile.ZipFile('capture.zip') as z:
            for name in z.namelist():
              if name.endswith('/'):continue
              basename=Path(name).name
              m=re.fullmatch(r'frame-(\d+)\.png',basename)
              part='part2' if m and int(m.group(1))>=40 else 'part1'
              p=Path(part)/basename
              p.parent.mkdir(exist_ok=True)
              p.write_bytes(z.read(name))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: baozi-part1, path: part1/}
      - uses: actions/upload-artifact@v4
        with: {name: baozi-part2, path: part2/}
